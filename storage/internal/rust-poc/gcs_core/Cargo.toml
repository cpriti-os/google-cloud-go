[package]
name = "gcs_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
bytes = "1"
futures = "0.3"
google-cloud-storage = "1.20.0"
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
