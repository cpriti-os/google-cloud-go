<svg width="850" height="420" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <style>
    .title { font-size: 16px; font-weight: bold; fill: #1f2937; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .axis { stroke: #d1d5db; stroke-width: 1; }
    .label { font-size: 12px; fill: #4b5563; }
    .val { font-size: 11px; font-weight: bold; }
    .legend { font-size: 12px; fill: #374151; }
  </style>
  
  <text x="20" y="30" class="title">Real GCS Prod Live Performance (Multi-Worker Uploads to gs://cpriti-sdk-autotune-bench)</text>
  <text x="20" y="48" class="subtitle">Direct Go SDK uploads over live network comparing Static 16MB Chunking vs Smart AIMD Auto-Tuning (32MB+)</text>
  
  <!-- Left Panel: Throughput (MB/s) -->
  <text x="50" y="85" style="font-size: 14px; font-weight: bold; fill: #111827;">Network Throughput (MB/s) - Higher is Better</text>
  <line x1="50" y1="320" x2="400" y2="320" class="axis" />
  <line x1="50" y1="100" x2="50" y2="320" class="axis" />
  <rect x="70" y="242.9" width="40" height="77.1" fill="#9ca3af" rx="3" />
  <text x="90" y="237.9" text-anchor="middle" class="val" fill="#374151">13.5</text>
  <rect x="114" y="202.2" width="40" height="117.8" fill="#10b981" rx="3" />
  <text x="134" y="197.2" text-anchor="middle" class="val" fill="#047857">20.7</text>
  <text x="112" y="340" text-anchor="middle" class="label">256 MB (4x64)</text>
  <rect x="180" y="237.3" width="40" height="82.7" fill="#9ca3af" rx="3" />
  <text x="200" y="232.3" text-anchor="middle" class="val" fill="#374151">14.5</text>
  <rect x="224" y="185.2" width="40" height="134.8" fill="#10b981" rx="3" />
  <text x="244" y="180.2" text-anchor="middle" class="val" fill="#047857">23.6</text>
  <text x="222" y="340" text-anchor="middle" class="label">512 MB (4x128)</text>
  <rect x="290" y="199.0" width="40" height="121.0" fill="#9ca3af" rx="3" />
  <text x="310" y="194.0" text-anchor="middle" class="val" fill="#374151">21.2</text>
  <rect x="334" y="135.1" width="40" height="184.9" fill="#10b981" rx="3" />
  <text x="354" y="130.1" text-anchor="middle" class="val" fill="#047857">32.4</text>
  <text x="332" y="340" text-anchor="middle" class="label">1024 MB (4x256)</text>

  <!-- Right Panel: Duration (s) -->
  <text x="470" y="85" style="font-size: 14px; font-weight: bold; fill: #111827;">Transfer Duration (s) - Lower is Faster</text>
  <line x1="470" y1="320" x2="820" y2="320" class="axis" />
  <line x1="470" y1="100" x2="470" y2="320" class="axis" />
  <rect x="490" y="267.0" width="40" height="53.0" fill="#ef4444" rx="3" />
  <text x="510" y="262.0" text-anchor="middle" class="val" fill="#b91c1c">18.9s</text>
  <rect x="534" y="285.3" width="40" height="34.7" fill="#3b82f6" rx="3" />
  <text x="554" y="280.3" text-anchor="middle" class="val" fill="#1d4ed8">12.4s</text>
  <text x="532" y="360" text-anchor="middle" style="font-size:11px; font-weight:bold; fill:#047857;">1.53x Faster</text>
  <text x="532" y="340" text-anchor="middle" class="label">256 MB (4x64)</text>
  <rect x="600" y="221.1" width="40" height="98.9" fill="#ef4444" rx="3" />
  <text x="620" y="216.1" text-anchor="middle" class="val" fill="#b91c1c">35.3s</text>
  <rect x="644" y="259.4" width="40" height="60.6" fill="#3b82f6" rx="3" />
  <text x="664" y="254.4" text-anchor="middle" class="val" fill="#1d4ed8">21.7s</text>
  <text x="642" y="360" text-anchor="middle" style="font-size:11px; font-weight:bold; fill:#047857;">1.63x Faster</text>
  <text x="642" y="340" text-anchor="middle" class="label">512 MB (4x128)</text>
  <rect x="710" y="184.9" width="40" height="135.1" fill="#ef4444" rx="3" />
  <text x="730" y="179.9" text-anchor="middle" class="val" fill="#b91c1c">48.2s</text>
  <rect x="754" y="231.6" width="40" height="88.4" fill="#3b82f6" rx="3" />
  <text x="774" y="226.6" text-anchor="middle" class="val" fill="#1d4ed8">31.6s</text>
  <text x="752" y="360" text-anchor="middle" style="font-size:11px; font-weight:bold; fill:#047857;">1.53x Faster</text>
  <text x="752" y="340" text-anchor="middle" class="label">1024 MB (4x256)</text>

  <!-- Legend -->
  <g transform="translate(180, 385)">
    <rect x="0" y="0" width="16" height="16" fill="#9ca3af" rx="2" />
    <text x="22" y="13" class="legend">Static 16MB Default</text>
    <rect x="180" y="0" width="16" height="16" fill="#10b981" rx="2" />
    <text x="202" y="13" class="legend">Smart Auto-Tuning (32MB+)</text>
  </g>
</svg>
