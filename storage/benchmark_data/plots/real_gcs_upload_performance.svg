<svg width="850" height="420" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <style>
    .title { font-size: 16px; font-weight: bold; fill: #1f2937; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .axis { stroke: #d1d5db; stroke-width: 1; }
    .label { font-size: 12px; fill: #4b5563; }
    .val { font-size: 11px; font-weight: bold; }
    .legend { font-size: 12px; fill: #374151; }
  </style>
  
  <text x="20" y="30" class="title">Real GCS Prod Live Performance (Multi-Worker Uploads to gs://cpriti-sdk-autotune-bench)</text>
  <text x="20" y="48" class="subtitle">Direct Go SDK uploads over live network comparing Static 16MB Chunking vs Smart AIMD Auto-Tuning (32MB+)</text>
  
  <!-- Left Panel: Throughput (MB/s) -->
  <text x="50" y="85" style="font-size: 14px; font-weight: bold; fill: #111827;">Network Throughput (MB/s) - Higher is Better</text>
  <line x1="50" y1="320" x2="400" y2="320" class="axis" />
  <line x1="50" y1="100" x2="50" y2="320" class="axis" />
  <rect x="70" y="242.1" width="40" height="77.9" fill="#9ca3af" rx="3" />
  <text x="90" y="237.1" text-anchor="middle" class="val" fill="#374151">13.7</text>
  <rect x="114" y="242.1" width="40" height="77.9" fill="#10b981" rx="3" />
  <text x="134" y="237.1" text-anchor="middle" class="val" fill="#047857">13.7</text>
  <text x="112" y="340" text-anchor="middle" class="label">256 MB (4x64)</text>
  <rect x="180" y="235.4" width="40" height="84.6" fill="#9ca3af" rx="3" />
  <text x="200" y="230.4" text-anchor="middle" class="val" fill="#374151">14.8</text>
  <rect x="224" y="235.4" width="40" height="84.6" fill="#10b981" rx="3" />
  <text x="244" y="230.4" text-anchor="middle" class="val" fill="#047857">14.8</text>
  <text x="222" y="340" text-anchor="middle" class="label">512 MB (4x128)</text>
  <rect x="290" y="198.0" width="40" height="122.0" fill="#9ca3af" rx="3" />
  <text x="310" y="193.0" text-anchor="middle" class="val" fill="#374151">21.4</text>
  <rect x="334" y="198.0" width="40" height="122.0" fill="#10b981" rx="3" />
  <text x="354" y="193.0" text-anchor="middle" class="val" fill="#047857">21.4</text>
  <text x="332" y="340" text-anchor="middle" class="label">1024 MB (4x256)</text>

  <!-- Right Panel: Duration (s) -->
  <text x="470" y="85" style="font-size: 14px; font-weight: bold; fill: #111827;">Transfer Duration (s) - Lower is Faster</text>
  <line x1="470" y1="320" x2="820" y2="320" class="axis" />
  <line x1="470" y1="100" x2="470" y2="320" class="axis" />
  <rect x="490" y="267.6" width="40" height="52.4" fill="#ef4444" rx="3" />
  <text x="510" y="262.6" text-anchor="middle" class="val" fill="#b91c1c">18.7s</text>
  <rect x="534" y="267.6" width="40" height="52.4" fill="#3b82f6" rx="3" />
  <text x="554" y="262.6" text-anchor="middle" class="val" fill="#1d4ed8">18.7s</text>
  <text x="532" y="360" text-anchor="middle" style="font-size:11px; font-weight:bold; fill:#047857;">1.00x Faster</text>
  <text x="532" y="340" text-anchor="middle" class="label">256 MB (4x64)</text>
  <rect x="600" y="223.4" width="40" height="96.6" fill="#ef4444" rx="3" />
  <text x="620" y="218.4" text-anchor="middle" class="val" fill="#b91c1c">34.5s</text>
  <rect x="644" y="223.4" width="40" height="96.6" fill="#3b82f6" rx="3" />
  <text x="664" y="218.4" text-anchor="middle" class="val" fill="#1d4ed8">34.5s</text>
  <text x="642" y="360" text-anchor="middle" style="font-size:11px; font-weight:bold; fill:#047857;">1.00x Faster</text>
  <text x="642" y="340" text-anchor="middle" class="label">512 MB (4x128)</text>
  <rect x="710" y="186.1" width="40" height="133.9" fill="#ef4444" rx="3" />
  <text x="730" y="181.1" text-anchor="middle" class="val" fill="#b91c1c">47.8s</text>
  <rect x="754" y="186.1" width="40" height="133.9" fill="#3b82f6" rx="3" />
  <text x="774" y="181.1" text-anchor="middle" class="val" fill="#1d4ed8">47.8s</text>
  <text x="752" y="360" text-anchor="middle" style="font-size:11px; font-weight:bold; fill:#047857;">1.00x Faster</text>
  <text x="752" y="340" text-anchor="middle" class="label">1024 MB (4x256)</text>

  <!-- Legend -->
  <g transform="translate(180, 385)">
    <rect x="0" y="0" width="16" height="16" fill="#9ca3af" rx="2" />
    <text x="22" y="13" class="legend">Static 16MB Default</text>
    <rect x="180" y="0" width="16" height="16" fill="#10b981" rx="2" />
    <text x="202" y="13" class="legend">Smart Auto-Tuning (32MB+)</text>
  </g>
</svg>
