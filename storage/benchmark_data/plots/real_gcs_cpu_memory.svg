<svg width="850" height="420" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <style>
    .title { font-size: 16px; font-weight: bold; fill: #1f2937; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .axis { stroke: #d1d5db; stroke-width: 1; }
    .label { font-size: 12px; fill: #4b5563; }
    .val { font-size: 11px; font-weight: bold; }
    .legend { font-size: 12px; fill: #374151; }
  </style>
  
  <text x="20" y="30" class="title">Real GCS Prod CPU Time &amp; Heap Memory Allocation</text>
  <text x="20" y="48" class="subtitle">Direct measurements via getrusage (User+Sys CPU) &amp; Go runtime.MemStats during live uploads to GCS</text>
  
  <!-- Left Panel: CPU Time (ms) -->
  <text x="50" y="85" style="font-size: 14px; font-weight: bold; fill: #111827;">Total CPU Time (ms) [User + Sys CPU]</text>
  <line x1="50" y1="320" x2="400" y2="320" class="axis" />
  <line x1="50" y1="100" x2="50" y2="320" class="axis" />
  <rect x="70" y="261.9" width="40" height="58.1" fill="#f59e0b" rx="3" />
  <text x="90" y="256.9" text-anchor="middle" class="val" fill="#b45309">2323ms</text>
  <rect x="114" y="261.9" width="40" height="58.1" fill="#10b981" rx="3" />
  <text x="134" y="256.9" text-anchor="middle" class="val" fill="#047857">2323ms</text>
  <text x="112" y="340" text-anchor="middle" class="label">256 MB (4x64)</text>
  <rect x="180" y="197.5" width="40" height="122.5" fill="#f59e0b" rx="3" />
  <text x="200" y="192.5" text-anchor="middle" class="val" fill="#b45309">4902ms</text>
  <rect x="224" y="197.5" width="40" height="122.5" fill="#10b981" rx="3" />
  <text x="244" y="192.5" text-anchor="middle" class="val" fill="#047857">4902ms</text>
  <text x="222" y="340" text-anchor="middle" class="label">512 MB (4x128)</text>
  <rect x="290" y="100.8" width="40" height="219.2" fill="#f59e0b" rx="3" />
  <text x="310" y="95.8" text-anchor="middle" class="val" fill="#b45309">8767ms</text>
  <rect x="334" y="100.8" width="40" height="219.2" fill="#10b981" rx="3" />
  <text x="354" y="95.8" text-anchor="middle" class="val" fill="#047857">8767ms</text>
  <text x="332" y="340" text-anchor="middle" class="label">1024 MB (4x256)</text>

  <!-- Right Panel: Heap Memory (MB) -->
  <text x="470" y="85" style="font-size: 14px; font-weight: bold; fill: #111827;">Peak Heap Memory (MB) [Capped by Guardrail]</text>
  <line x1="470" y1="320" x2="820" y2="320" class="axis" />
  <line x1="470" y1="100" x2="470" y2="320" class="axis" />
  <rect x="490" y="137.7" width="40" height="182.3" fill="#6366f1" rx="3" />
  <text x="510" y="132.7" text-anchor="middle" class="val" fill="#4338ca">137.1M</text>
  <rect x="534" y="137.7" width="40" height="182.3" fill="#06b6d4" rx="3" />
  <text x="554" y="132.7" text-anchor="middle" class="val" fill="#0e7490">137.1M</text>
  <text x="532" y="340" text-anchor="middle" class="label">256 MB (4x64)</text>
  <rect x="600" y="58.7" width="40" height="261.3" fill="#6366f1" rx="3" />
  <text x="620" y="53.7" text-anchor="middle" class="val" fill="#4338ca">196.5M</text>
  <rect x="644" y="58.7" width="40" height="261.3" fill="#06b6d4" rx="3" />
  <text x="664" y="53.7" text-anchor="middle" class="val" fill="#0e7490">196.5M</text>
  <text x="642" y="340" text-anchor="middle" class="label">512 MB (4x128)</text>
  <rect x="710" y="-112.8" width="40" height="432.8" fill="#6366f1" rx="3" />
  <text x="730" y="-117.8" text-anchor="middle" class="val" fill="#4338ca">325.4M</text>
  <rect x="754" y="-112.8" width="40" height="432.8" fill="#06b6d4" rx="3" />
  <text x="774" y="-117.8" text-anchor="middle" class="val" fill="#0e7490">325.4M</text>
  <text x="752" y="340" text-anchor="middle" class="label">1024 MB (4x256)</text>

  <!-- Legend -->
  <g transform="translate(160, 385)">
    <rect x="0" y="0" width="16" height="16" fill="#f59e0b" rx="2" />
    <text x="22" y="13" class="legend">Static CPU Time</text>
    <rect x="150" y="0" width="16" height="16" fill="#10b981" rx="2" />
    <text x="172" y="13" class="legend">Smart Auto-Tuning CPU Time</text>
    <rect x="390" y="0" width="16" height="16" fill="#6366f1" rx="2" />
    <text x="412" y="13" class="legend">Static Heap</text>
    <rect x="520" y="0" width="16" height="16" fill="#06b6d4" rx="2" />
    <text x="542" y="13" class="legend">Smart Heap (Capped)</text>
  </g>
</svg>
