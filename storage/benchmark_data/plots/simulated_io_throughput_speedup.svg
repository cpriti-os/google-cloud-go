<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#1e1e2e" rx="12" />
  <text x="475" y="40" fill="#cdd6f4" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    High-Fidelity Simulated I/O Benchmark: Throughput (MB/s) &amp; Speedup
  </text>
  <text x="475" y="65" fill="#a6adc8" font-size="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Comparing 'Without Smart Tuning' (Baseline) vs 'With Dynamic AI Auto-Tuning'
  </text>

  <!-- Legend -->
  <rect x="250" y="85" width="16" height="16" fill="#f38ba8" rx="3" />
  <text x="275" y="98" fill="#cdd6f4" font-size="12" font-family="system-ui, -apple-system, sans-serif">Without Smart Tuning (Static)</text>
  <rect x="530" y="85" width="16" height="16" fill="#a6e3a1" rx="3" />
  <text x="555" y="98" fill="#cdd6f4" font-size="12" font-family="system-ui, -apple-system, sans-serif">With Dynamic AI Auto-Tuning</text>

  <!-- Slow Producer Inflow (2 MB/s) -->
  <text x="220" y="158" fill="#cdd6f4" font-size="13" font-weight="600" text-anchor="end" font-family="system-ui, -apple-system, sans-serif">Slow Producer Inflow (2 MB/s)</text>
  
  <!-- Without bar -->
  <rect x="230" y="140" width="4" height="14" fill="#f38ba8" rx="3" />
  <text x="239" y="151" fill="#f38ba8" font-size="11" font-weight="bold" font-family="monospace">1.9 MB/s</text>

  <!-- With bar -->
  <rect x="230" y="158" width="4" height="14" fill="#a6e3a1" rx="3" />
  <text x="239" y="169" fill="#a6e3a1" font-size="11" font-weight="bold" font-family="monospace">1.4 MB/s</text>

  <!-- Speedup badge -->
  <rect x="800" y="144" width="110" height="24" fill="#313244" rx="6" stroke="#89b4fa" stroke-width="1.5" />
  <text x="855" y="160" fill="#89b4fa" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">0.76x Speedup</text>

  <!-- Burst Checkpoint (1 GB Upload) -->
  <text x="220" y="226" fill="#cdd6f4" font-size="13" font-weight="600" text-anchor="end" font-family="system-ui, -apple-system, sans-serif">Burst Checkpoint (1 GB Upload)</text>
  
  <!-- Without bar -->
  <rect x="230" y="208" width="99" height="14" fill="#f38ba8" rx="3" />
  <text x="334" y="219" fill="#f38ba8" font-size="11" font-weight="bold" font-family="monospace">177.1 MB/s</text>

  <!-- With bar -->
  <rect x="230" y="226" width="435" height="14" fill="#a6e3a1" rx="3" />
  <text x="670" y="237" fill="#a6e3a1" font-size="11" font-weight="bold" font-family="monospace">774.3 MB/s</text>

  <!-- Speedup badge -->
  <rect x="800" y="212" width="110" height="24" fill="#313244" rx="6" stroke="#89b4fa" stroke-width="1.5" />
  <text x="855" y="228" fill="#89b4fa" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">4.37x Speedup</text>

  <!-- Random Sparse Reads (Self-Healing) -->
  <text x="220" y="294" fill="#cdd6f4" font-size="13" font-weight="600" text-anchor="end" font-family="system-ui, -apple-system, sans-serif">Random Sparse Reads (Self-Healing)</text>
  
  <!-- Without bar -->
  <rect x="230" y="276" width="4" height="14" fill="#f38ba8" rx="3" />
  <text x="239" y="287" fill="#f38ba8" font-size="11" font-weight="bold" font-family="monospace">0.5 MB/s</text>

  <!-- With bar -->
  <rect x="230" y="294" width="4" height="14" fill="#a6e3a1" rx="3" />
  <text x="239" y="305" fill="#a6e3a1" font-size="11" font-weight="bold" font-family="monospace">6.3 MB/s</text>

  <!-- Speedup badge -->
  <rect x="800" y="280" width="110" height="24" fill="#313244" rx="6" stroke="#89b4fa" stroke-width="1.5" />
  <text x="855" y="296" fill="#89b4fa" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">12.67x Speedup</text>

  <!-- Strided Columnar Scan (Parquet) -->
  <text x="220" y="362" fill="#cdd6f4" font-size="13" font-weight="600" text-anchor="end" font-family="system-ui, -apple-system, sans-serif">Strided Columnar Scan (Parquet)</text>
  
  <!-- Without bar -->
  <rect x="230" y="344" width="6" height="14" fill="#f38ba8" rx="3" />
  <text x="241" y="355" fill="#f38ba8" font-size="11" font-weight="bold" font-family="monospace">10.9 MB/s</text>

  <!-- With bar -->
  <rect x="230" y="362" width="6" height="14" fill="#a6e3a1" rx="3" />
  <text x="241" y="373" fill="#a6e3a1" font-size="11" font-weight="bold" font-family="monospace">10.9 MB/s</text>

  <!-- Speedup badge -->
  <rect x="800" y="348" width="110" height="24" fill="#313244" rx="6" stroke="#89b4fa" stroke-width="1.5" />
  <text x="855" y="364" fill="#89b4fa" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">1.00x Speedup</text>

  <!-- Streaming DataLoader (500 MB) -->
  <text x="220" y="430" fill="#cdd6f4" font-size="13" font-weight="600" text-anchor="end" font-family="system-ui, -apple-system, sans-serif">Streaming DataLoader (500 MB)</text>
  
  <!-- Without bar -->
  <rect x="230" y="412" width="27" height="14" fill="#f38ba8" rx="3" />
  <text x="262" y="423" fill="#f38ba8" font-size="11" font-weight="bold" font-family="monospace">48.3 MB/s</text>

  <!-- With bar -->
  <rect x="230" y="430" width="132" height="14" fill="#a6e3a1" rx="3" />
  <text x="367" y="441" fill="#a6e3a1" font-size="11" font-weight="bold" font-family="monospace">236.1 MB/s</text>

  <!-- Speedup badge -->
  <rect x="800" y="416" width="110" height="24" fill="#313244" rx="6" stroke="#89b4fa" stroke-width="1.5" />
  <text x="855" y="432" fill="#89b4fa" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">4.89x Speedup</text>
</svg>